<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · FiveYearOS</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #171717; --muted: #6b6b6b; --border: #e5e5e5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1c; --fg: #f5f5f5; --muted: #a3a3a3; --border: #333; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 22rem; padding: 1.5rem; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0 0 1.25rem; }
  a, button { display: inline-block; padding: .6rem 1rem; border: 1px solid var(--border); border-radius: .5rem; color: inherit; background: transparent; font: inherit; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>This page hasn't been opened on this device yet, so there's no saved copy. Pages you've visited before still open offline.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <a href="/today">Today</a>
</main>
</body>
</html>
